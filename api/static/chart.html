<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background: #030712; color: #e2e8f0; font-family: ui-monospace, monospace; }
    #chart-candles, #chart-rsi { width: 100%; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <div class="flex items-center gap-3 px-4 py-2 bg-gray-900 border-b border-gray-800 shrink-0">
    <span id="hdr-symbol" class="font-semibold text-slate-100 text-sm"></span>
    <span id="hdr-tf"     class="bg-gray-800 text-slate-300 px-2 py-0.5 rounded text-xs"></span>
    <span id="hdr-live"   class="bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded text-xs">LIVE</span>
    <span id="hdr-count"  class="text-xs text-slate-500"></span>
    <span id="hdr-status" class="text-xs text-amber-400 ml-2"></span>
  </div>

  <div id="loading" class="flex-1 flex flex-col items-center justify-center gap-3">
    <div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
    <p id="loading-msg" class="text-sm text-slate-400">Загрузка LIVE свечей...</p>
  </div>

  <div id="charts" class="flex-1 flex flex-col min-h-0 hidden">
    <div id="chart-candles" style="flex: 1; min-height: 0;"></div>
    <div id="chart-rsi"     style="height: 160px; border-top: 1px solid #1f2937;"></div>
  </div>

<script>
const params  = new URLSearchParams(location.search);
const symbol  = params.get('symbol')   || '';
const tf      = params.get('timeframe')|| '15m';

const tradeNum = k => { const v = parseFloat(params.get(k)); return isFinite(v) && v > 0 ? v : null; };
const trade = {
  entry:  tradeNum('entry'),
  sl:     tradeNum('sl'),
  tp1:    tradeNum('tp1'),
  tp2:    tradeNum('tp2'),
  dir:    (params.get('dir') || '').toLowerCase(),
  opened: params.get('opened') ? Date.parse(params.get('opened')) : null,
  exit:   tradeNum('exit'),
  closed: params.get('closed') ? Date.parse(params.get('closed')) : null,
  pnl:    params.get('pnl') !== null && params.get('pnl') !== '' ? parseFloat(params.get('pnl')) : null,
  reason: params.get('reason') || '',
};

document.title = symbol + ' ' + tf;
document.getElementById('hdr-symbol').textContent = symbol;
document.getElementById('hdr-tf').textContent     = tf;

function setStatus(msg) { document.getElementById('hdr-status').textContent = msg; }
function setLoading(msg){ document.getElementById('loading-msg').textContent = msg; }

async function fetchData() {
  const url = `/api/chart/data?symbol=${encodeURIComponent(symbol)}&timeframe=${encodeURIComponent(tf)}&limit=500`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const C_BULL = '#33c570';
const C_BEAR = '#ae4ce6';

function calcPriceFormat(candles, trade) {
  const samples = [];
  if (trade) {
    [trade.entry, trade.sl, trade.tp1, trade.tp2, trade.exit].forEach(v => {
      if (v && isFinite(v) && v > 0) samples.push(v);
    });
  }
  if (candles && candles.length) {
    const last = candles[candles.length - 1];
    if (last && last.close) samples.push(last.close);
    if (last && last.low) samples.push(last.low);
  }
  const refPrice = samples.length ? Math.min(...samples) : 1;

  let precision = 2;
  if (refPrice < 0.0001)      precision = 8;
  else if (refPrice < 0.001)  precision = 7;
  else if (refPrice < 0.01)   precision = 6;
  else if (refPrice < 0.1)    precision = 5;
  else if (refPrice < 1)      precision = 4;
  else if (refPrice < 50)     precision = 4;
  else                        precision = 2;

  for (const s of samples) {
    const sStr = s.toString();
    let dec = 0;
    if (sStr.includes('e-')) {
      dec = parseInt(sStr.split('e-')[1], 10);
    } else if (sStr.includes('.')) {
      dec = sStr.split('.')[1].length;
    }
    if (dec > precision) {
      precision = Math.min(dec, 8);
    }
  }

  const minMove = Number(Math.pow(10, -precision).toFixed(precision));
  return { precision, minMove };
}

function renderChart(data) {
  const { precision, minMove } = calcPriceFormat(data.candles, trade);
  const theme = {
    layout:     { background: { color: '#030712' }, textColor: '#94a3b8' },
    grid:       { vertLines: { color: '#1f2937' }, horzLines: { color: '#1f2937' } },
    timeScale:  { borderColor: '#374151', timeVisible: true, secondsVisible: false },
    rightPriceScale: { borderColor: '#374151' },
    crosshair:  { mode: LightweightCharts.CrosshairMode.Normal },
  };

  const candleEl = document.getElementById('chart-candles');
  const rsiEl    = document.getElementById('chart-rsi');

  const candleChart = LightweightCharts.createChart(candleEl, {
    ...theme, width: candleEl.clientWidth, height: candleEl.clientHeight,
  });
  const candleSeries = candleChart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a',   wickDownColor: '#ef5350',
    priceFormat: {
      type: 'price',
      precision: precision,
      minMove: minMove,
    },
  });
  candleSeries.setData(data.candles);

  (data.zones || []).forEach(z => {
    const broken = z.is_broken;
    const style  = broken ? LightweightCharts.LineStyle.Dashed
                           : LightweightCharts.LineStyle.Solid;
    const hex = (z.color || '#33c570').replace('#','');
    const r = parseInt(hex.slice(0,2),16), g = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);

    const s1 = candleChart.addLineSeries({
      color: z.color, lineWidth: 1, lineStyle: style,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
    });
    s1.setData([{ time: z.time_start, value: z.level }, { time: z.time_end, value: z.level }]);

    if (!broken) {
      const s2 = candleChart.addLineSeries({
        color: `rgba(${r},${g},${b},0.18)`, lineWidth: 6, lineStyle: LightweightCharts.LineStyle.Solid,
        priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false,
      });
      s2.setData([{ time: z.time_start, value: z.level }, { time: z.time_end, value: z.level }]);
    }
  });

  if (trade.entry) {
    const dirLabel = trade.dir === 'long' ? 'LONG' : trade.dir === 'short' ? 'SHORT' : '';
    candleSeries.createPriceLine({
      price: trade.entry, color: '#60a5fa', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true, title: 'Entry ' + dirLabel,
    });
    if (trade.sl) candleSeries.createPriceLine({
      price: trade.sl, color: '#ef4444', lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'SL',
    });
    if (trade.tp1) candleSeries.createPriceLine({
      price: trade.tp1, color: '#22c55e', lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'TP1',
    });
    if (trade.tp2) candleSeries.createPriceLine({
      price: trade.tp2, color: '#16a34a', lineWidth: 1,
      lineStyle: LightweightCharts.LineStyle.Dashed,
      axisLabelVisible: true, title: 'TP2',
    });

    if (trade.exit) candleSeries.createPriceLine({
      price: trade.exit, color: '#f97316', lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      axisLabelVisible: true, title: 'Exit',
    });

    const badge = document.createElement('span');
    badge.className = trade.dir === 'long'
      ? 'bg-green-900 text-green-300 px-2 py-0.5 rounded text-xs'
      : 'bg-red-900 text-red-300 px-2 py-0.5 rounded text-xs';
    if (trade.exit) {
      const pnlTxt = trade.pnl !== null && isFinite(trade.pnl)
        ? ' ' + (trade.pnl >= 0 ? '+' : '−') + '$' + Math.abs(trade.pnl).toFixed(2) : '';
      badge.textContent = dirLabel + ' закрыта: ' + (trade.reason || '').replace('_', ' ') + pnlTxt;
      badge.className = (trade.pnl !== null && trade.pnl >= 0)
        ? 'bg-green-900 text-green-300 px-2 py-0.5 rounded text-xs'
        : 'bg-red-900 text-red-300 px-2 py-0.5 rounded text-xs';
    } else {
      badge.textContent = 'Позиция ' + dirLabel + ' @ ' + (trade.entry ? trade.entry.toFixed(precision) : '');
    }
    document.getElementById('hdr-tf').insertAdjacentElement('afterend', badge);
  }

  const markers = (data.markers || []).slice();

  if (trade.entry && trade.opened && data.candles?.length) {
    const openedSec = trade.opened / 1000;
    let mTime = null, offRange = false;
    if (openedSec <= data.candles[0].time) {
      mTime = data.candles[0].time; offRange = true;
    } else {
      for (let i = data.candles.length - 1; i >= 0; i--) {
        if (data.candles[i].time <= openedSec) { mTime = data.candles[i].time; break; }
      }
    }
    if (mTime !== null) {
      markers.push({
        time: mTime,
        position: trade.dir === 'short' ? 'aboveBar' : 'belowBar',
        shape: trade.dir === 'short' ? 'arrowDown' : 'arrowUp',
        color: '#60a5fa',
        text: offRange ? '← вход ранее' : 'вход',
      });
    }
  }

  if (trade.exit && trade.closed && data.candles?.length) {
    const closedSec = trade.closed / 1000;
    let mTime = null, offRange = false;
    if (closedSec <= data.candles[0].time) {
      mTime = data.candles[0].time; offRange = true;
    } else {
      for (let i = data.candles.length - 1; i >= 0; i--) {
        if (data.candles[i].time <= closedSec) { mTime = data.candles[i].time; break; }
      }
    }
    if (mTime !== null) {
      const win = trade.pnl !== null && trade.pnl >= 0;
      markers.push({
        time: mTime,
        position: trade.dir === 'short' ? 'belowBar' : 'aboveBar',
        shape: win ? 'circle' : 'square',
        color: win ? '#22c55e' : '#ef4444',
        text: (offRange ? '← ' : '') + (win ? '✓ выход' : '✗ выход'),
      });
    }
  }
  markers.sort((a, b) => a.time - b.time);
  if (markers.length) candleSeries.setMarkers(markers);

  const rsiChart = LightweightCharts.createChart(rsiEl, {
    ...theme, width: rsiEl.clientWidth, height: 160,
    rightPriceScale: { borderColor: '#374151', scaleMargins: { top: 0.05, bottom: 0.05 } },
  });
  const rsiSeries = rsiChart.addLineSeries({
    color: '#818cf8', lineWidth: 1.5,
    priceLineVisible: false, lastValueVisible: false,
  });
  if (data.rsi?.length) {
    rsiSeries.setData(data.rsi);
    const bullPts = data.rsi.filter(p => p.value <= 30);
    const bearPts = data.rsi.filter(p => p.value >= 70);
    if (bullPts.length) {
      const bs = rsiChart.addLineSeries({ color: C_BULL, lineWidth: 2, priceLineVisible:false, lastValueVisible:false });
      bs.setData(bullPts);
    }
    if (bearPts.length) {
      const bs = rsiChart.addLineSeries({ color: C_BEAR, lineWidth: 2, priceLineVisible:false, lastValueVisible:false });
      bs.setData(bearPts);
    }
  }
  rsiSeries.createPriceLine({ price: 70, color: C_BEAR,    lineWidth: 1, lineStyle: 2, axisLabelVisible: true,  title: '70' });
  rsiSeries.createPriceLine({ price: 30, color: C_BULL,    lineWidth: 1, lineStyle: 2, axisLabelVisible: true,  title: '30' });
  rsiSeries.createPriceLine({ price: 50, color: '#475569', lineWidth: 1, lineStyle: 3, axisLabelVisible: false });

  candleChart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r) rsiChart.timeScale().setVisibleLogicalRange(r); });
  rsiChart.timeScale().subscribeVisibleLogicalRangeChange(r => { if (r) candleChart.timeScale().setVisibleLogicalRange(r); });
  candleChart.timeScale().fitContent();

  new ResizeObserver(() => {
    candleChart.applyOptions({ width: candleEl.clientWidth, height: candleEl.clientHeight });
    rsiChart.applyOptions({ width: rsiEl.clientWidth });
  }).observe(document.getElementById('charts'));

  if (!data.indicators_ok) setStatus('RSI не рассчитан — мало данных');
  document.getElementById('hdr-count').textContent = `${data.total || data.candles.length} свечей`;
}

async function main() {
  if (!symbol) { setLoading('Не указан символ'); return; }
  try {
    const data = await fetchData();
    if (!data.candles?.length) {
      setLoading('Нет LIVE данных для ' + symbol);
      return;
    }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('charts').classList.remove('hidden');
    renderChart(data);
  } catch (e) {
    setLoading('Ошибка загрузки: ' + (e.message || e));
  }
}

main();
</script>
</body>
</html>
