name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    name: Smoke Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Offline smokes
        run: |
          python scripts/smoke_signal.py
          python scripts/smoke_risk.py
          python scripts/smoke_decide.py
          python scripts/smoke_llm_decide.py
          python scripts/smoke_paper.py
          python scripts/smoke_account.py
          python scripts/smoke_exits.py
          python scripts/smoke_atr_rtoken.py
          python scripts/smoke_pair_blocker.py
          python scripts/smoke_symbols.py
          python scripts/smoke_upnl.py
          python scripts/smoke_tick_stops.py
          python scripts/smoke_paper_fallback.py
          python scripts/smoke_hub_leverage.py
          python scripts/smoke_hub_price_scale.py
          python scripts/smoke_hub_fill_levels.py
          python scripts/smoke_price_sanity.py
          python scripts/smoke_reconcile.py
          python scripts/smoke_chart.py
          python scripts/smoke_export_paper_log.py
          python scripts/verify_decision_log.py
          python scripts/generate_s2_validation.py
          git diff --exit-code -- docs/evidence/s2_validation.md docs/evidence/s2_validation.json

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config
